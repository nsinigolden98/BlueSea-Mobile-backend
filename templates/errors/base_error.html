<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BlueSea{% endblock %}</title>
    <style>
        :root {
            --brand: #203ae3;
            --brand-dark: #162cab;
            --ink: #1f2937;
            --muted: #6b7280;
            --bg: #f4f5f7;
            --card: #ffffff;
            --border: #e5e7eb;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            font-family: Arial, Helvetica, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            line-height: 1.6;
        }
        main.error-card {
            width: 100%;
            max-width: 520px;
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px 36px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(16, 24, 40, 0.08);
        }
        .brand {
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--brand);
            font-size: 20px;
            margin-bottom: 24px;
        }
        .illustration {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .illustration svg {
            width: 120px;
            height: 120px;
        }
        .code {
            font-size: 64px;
            font-weight: 800;
            color: var(--brand);
            line-height: 1;
            margin: 0;
        }
        .title {
            font-size: 24px;
            font-weight: 700;
            margin: 12px 0 8px;
            color: var(--ink);
        }
        .message {
            font-size: 15px;
            color: var(--muted);
            margin: 0 auto 24px;
            max-width: 420px;
        }
        .message code {
            background-color: #eef1fb;
            color: var(--brand);
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 13px;
            word-break: break-all;
        }
        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            padding: 12px 22px;
            border-radius: 10px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: background-color 0.15s ease, color 0.15s ease;
        }
        .btn-primary {
            background-color: var(--brand);
            color: #ffffff;
        }
        .btn-primary:hover {
            background-color: #162cab;
        }
        @media (max-width: 480px) {
            main.error-card { padding: 32px 22px; }
            .code { font-size: 52px; }
            .title { font-size: 20px; }
        }
    </style>
</head>
<body>
    <main class="error-card">
        <div class="brand">BlueSea</div>
        <div class="illustration">{% block illustration %}{% endblock %}</div>
        <p class="code">{% block code %}{% endblock %}</p>
        <h1 class="title">{% block heading %}{% endblock %}</h1>
        <p class="message">{% block message %}{% endblock %}</p>
        <div class="actions">
            <a class="btn btn-primary" href="/">Back to Home</a>
        </div>
    </main>
</body>
</html>
