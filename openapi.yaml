  /autotopup/create/:
    post:
      operationId: autotopup_create_create
      description: Schedule a new auto top-up. Funds will be locked from wallet. Requires
        transaction PIN.
      summary: Create a new auto top-up
      tags:
      - Auto Top-Up
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoTopUpCreate'
            examples:
              AirtimeAutoTop-Up:
                value:
                  service_type: airtime
                  amount: '100.00'
                  phone_number: 08012345678
                  network: mtn
                  start_date: '2025-11-02T10:00:00Z'
                  repeat_days: 7
                  is_active: true
                  transaction_pin: '1234'
                summary: Airtime Auto Top-Up
          application/x-www-form-urlencoded:
