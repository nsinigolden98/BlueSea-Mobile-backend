openapi: 3.0.3
info:
  title: ''
  version: 0.0.0
paths:
  /accounts/auth/apple/:
    post:
      operationId: accounts_auth_apple_create
      description: Authenticate user using Apple OAuth token
      summary: Apple OAuth login
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppleLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppleLogin'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /accounts/auth/google/:
    post:
      operationId: accounts_auth_google_create
      description: Authenticate user using Google OAuth. Supports both ID token (client-side)
        and authorization code (server-side) flows.
      summary: Google OAuth login
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLogin'
            examples:
              IDTokenFlow(Client-side):
                value:
                  id_token: eyJhbGciOiJSUzI1NiIsImtpZCI6...
                summary: ID Token Flow (Client-side)
              AuthorizationCodeFlow(Server-side):
                value:
                  authorization_code: 4/0AY0e-g7...
                  redirect_uri: http://localhost:3000/auth/callback
                summary: Authorization Code Flow (Server-side)
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleLogin'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /accounts/login/:
    post:
      operationId: accounts_login_create
      description: Authenticate user and return JWT tokens
      summary: User login
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MyTokenObtainPair'
            examples:
              LoginRequest:
                value:
                  email: john@example.com
                  password: SecurePassword123
                summary: Login Request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MyTokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MyTokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                SuccessResponse:
                  value:
                    access_token: eyJ0eXAiOiJKV1QiLCJhbGc...
                    refresh_token: eyJ0eXAiOiJKV1QiLCJhbGc...
                    user:
                      id: 1
                      email: john@example.com
                      role: user
                      email_verified: true
                  summary: Success Response
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
