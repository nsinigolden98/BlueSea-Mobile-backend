          format: uri
          readOnly: true
          nullable: true
        instagram:
          type: string
          format: uri
          readOnly: true
          nullable: true
        twitter:
          type: string
          format: uri
          readOnly: true
          nullable: true
        tiktok:
          type: string
          format: uri
          readOnly: true
          nullable: true
        agreement_accepted:
          type: boolean
          readOnly: true
        rejected_reason:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - affiliate_name
      - agreement_accepted
      - commission_rate
      - created_at
      - facebook
      - id
      - instagram
      - is_approved
      - rejected_reason
      - status
