          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        commission_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
        commission_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        status:
          enum:
          - pending
          - success
          - payable
          - paid
          - revoked
          type: string
          description: |-
            * `pending` - Pending
            * `success` - Success
            * `payable` - Payable
            * `paid` - Paid
            * `revoked` - Revoked
