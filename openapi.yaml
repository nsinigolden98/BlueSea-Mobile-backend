          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        payable_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        paid_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - affiliate_name
      - buyer
      - buyer_email
      - commission_amount
      - commission_rate
      - created_at
      - event
      - event_title
      - gross_amount
      - id
      - paid_at
      - payable_at
      - status
      - ticket_count
