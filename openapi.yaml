components:
  schemas:
    AccountName:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        account_number:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        bank_code:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
      required:
      - account_number
      - bank_code
      - id
    AddMessage:
      type: object
      properties:
        message:
          type: string
        images:
          type: array
          items:
            type: string
            format: binary
          writeOnly: true
      required:
      - message
    AddMessageResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          $ref: '#/components/schemas/SupportMessage'
      required:
      - message
      - success
    AffiliateApply:
      type: object
      properties:
        affiliate_name:
          type: string
          pattern: ^[A-Za-z0-9]+$
          maxLength: 13
        facebook:
          type: string
          format: uri
          nullable: true
        instagram:
          type: string
          format: uri
          nullable: true
        twitter:
          type: string
          format: uri
          nullable: true
        tiktok:
          type: string
          format: uri
          nullable: true
        agreement:
          type: boolean
      required:
      - affiliate_name
      - agreement
    AffiliateDashboard:
      type: object
      properties:
        total_clicks:
          type: integer
        total_sales:
          type: integer
        pending_count:
          type: integer
        success_count:
          type: integer
        payable_count:
          type: integer
        paid_count:
          type: integer
        revoked_count:
          type: integer
        pending_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        payable_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        paid_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - paid_amount
      - paid_count
      - payable_amount
      - payable_count
      - pending_amount
      - pending_count
      - revoked_count
      - success_count
      - total_clicks
      - total_sales
