[package]
name = "bluesea-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["macros", "ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "macros", "chrono", "uuid", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
jsonwebtoken = "9"
pbkdf2 = "0.12"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
rsa = "0.9"
base64 = "0.22"
regex = "1"
hex = "0.4"
askama = "0.12"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
validator = { version = "0.18", features = ["derive"] }
subtle = "2"
utoipa = { version = "6.0.0", features = ["chrono"] }
utoipa-swagger-ui = { version = "10.0.1", features = ["axum"] }
utoipa-redoc = { version = "7.0.0", features = ["axum"] }
rust_decimal = "1.43.0"
qrcode = "0.14.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
nomba-rs = "0.4.0"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[profile.release]
strip = true
