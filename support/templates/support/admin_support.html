<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>BlueSea Support Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f6fa; color: #333; }
        .container { display: flex; height: 100vh; }
        .sidebar { width: 320px; background: #fff; border-right: 1px solid #e0e0e0; overflow-y: auto; flex-shrink: 0; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #e0e0e0; background: #1a73e8; color: #fff; }
        .sidebar-header h2 { font-size: 18px; margin-bottom: 4px; }
        .sidebar-header small { opacity: 0.8; font-size: 12px; }
        .ticket-item { padding: 14px 20px; border-bottom: 1px solid #f0f0f0; cursor: pointer; transition: background 0.2s; }
        .ticket-item:hover { background: #f0f4ff; }
        .ticket-item.active { background: #e8f0fe; border-left: 3px solid #1a73e8; }
        .ticket-item .subject { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
        .ticket-item .meta { display: flex; justify-content: space-between; font-size: 11px; color: #888; }
        .ticket-item .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; }
        .badge-open { background: #e8f5e9; color: #2e7d32; }
        .badge-in_progress { background: #fff3e0; color: #e65100; }
        .badge-resolved { background: #e3f2fd; color: #1565c0; }
        .badge-closed { background: #f5f5f5; color: #757575; }
        .badge-urgent { background: #ffebee; color: #c62828; }
        .badge-high { background: #fff3e0; color: #e65100; }
        .badge-medium { background: #f3e5f5; color: #7b1fa2; }
        .badge-low { background: #e8f5e9; color: #2e7d32; }
        .chat-area { flex: 1; display: flex; flex-direction: column; }
        .chat-header { padding: 16px 24px; border-bottom: 1px solid #e0e0e0; background: #fff; display: flex; justify-content: space-between; align-items: center; }
        .chat-header h3 { font-size: 16px; }
        .chat-header .info { font-size: 13px; color: #888; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 20px 24px; }
        .message { margin-bottom: 16px; display: flex; flex-direction: column; }
        .message.admin-msg { align-items: flex-end; }
        .message.user-msg { align-items: flex-start; }
        .message .sender { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
        .message.admin-msg .sender { color: #1a73e8; }
        .message.user-msg .sender { color: #2e7d32; }
        .message .bubble { max-width: 70%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
        .message.admin-msg .bubble { background: #1a73e8; color: #fff; border-bottom-right-radius: 4px; }
        .message.user-msg .bubble { background: #fff; color: #333; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .message .time { font-size: 11px; color: #999; margin-top: 2px; }
        .message .attachments { margin-top: 6px; }
        .message .attachments img { max-width: 200px; max-height: 200px; border-radius: 8px; margin-right: 6px; cursor: pointer; }
        .chat-input-area { padding: 16px 24px; border-top: 1px solid #e0e0e0; background: #fff; display: flex; gap: 10px; }
        .chat-input-area input[type="text"] { flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
        .chat-input-area input[type="text"]:focus { border-color: #1a73e8; }
        .chat-input-area button { padding: 10px 20px; background: #1a73e8; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; }
        .chat-input-area button:hover { background: #1557b0; }
        .chat-input-area button:disabled { background: #ccc; cursor: not-allowed; }
        .no-selection { flex: 1; display: flex; align-items: center; justify-content: center; color: #999; font-size: 16px; flex-direction: column; }
        .no-selection .icon { font-size: 48px; margin-bottom: 16px; }
        .toolbar { padding: 12px 24px; background: #fff; border-bottom: 1px solid #e0e0e0; display: flex; gap: 10px; align-items: center; }
        .toolbar select { padding: 6px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; }
        .toolbar .count { font-size: 12px; color: #888; margin-left: auto; }
        .ws-status { position: fixed; bottom: 16px; right: 16px; padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 600; }
        .ws-connected { background: #e8f5e9; color: #2e7d32; }
        .ws-disconnected { background: #ffebee; color: #c62828; }
        @media (max-width: 768px) { .sidebar { width: 240px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Support Tickets</h2>
                <small>Click a ticket to open chat</small>
            </div>
            <div id="ticket-list"></div>
        </div>
        <div class="chat-area" id="chatArea">
            <div class="no-selection" id="noSelection">
                <div class="icon">💬</div>
                <div>Select a ticket to start chatting</div>
            </div>
            <div id="chatView" style="display:none; flex-direction:column; flex:1;">
                <div class="chat-header">
                    <div>
                        <h3 id="ticketSubject"></h3>
                        <div class="info" id="ticketInfo"></div>
                    </div>
                    <div>
                        <select id="statusFilter" onchange="updateTicketStatus()">
                            <option value="open">Open</option>
                            <option value="in_progress">In Progress</option>
                            <option value="resolved">Resolved</option>
                            <option value="closed">Closed</option>
                        </select>
                        <select id="priorityFilter" onchange="updateTicketPriority()" style="margin-left:6px;">
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                            <option value="urgent">Urgent</option>
                        </select>
                    </div>
                </div>
                <div class="toolbar">
                    <span id="messageCount" class="count"></span>
                </div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-area">
                    <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
                    <button onclick="sendMessage()" id="sendBtn">Send</button>
                </div>
            </div>
        </div>
    </div>
    <div id="wsStatus" class="ws-status ws-disconnected">Disconnected</div>

    <script>
        let ws = null;
        let currentTicketId = null;
        let autoScroll = true;

        function getToken() {
            const match = document.cookie.match(/sessionid=([^;]+)/);
            if (match) return null;
            const meta = document.querySelector('meta[name="csrf-token"]');
            return meta ? meta.content : null;
        }

        function connectWS() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const token = getAuthToken();
            const url = currentTicketId
                ? `${protocol}//${location.host}/ws/support/${currentTicketId}/?token=${token}`
                : `${protocol}//${location.host}/ws/support/?token=${token}`;
            ws = new WebSocket(url);
            ws.onopen = () => {
                document.getElementById('wsStatus').className = 'ws-status ws-connected';
                document.getElementById('wsStatus').textContent = 'Connected';
            };
            ws.onclose = () => {
                document.getElementById('wsStatus').className = 'ws-status ws-disconnected';
                document.getElementById('wsStatus').textContent = 'Disconnected';
                setTimeout(connectWS, 3000);
            };
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleWSMessage(data);
            };
        }

        function getAuthToken() {
            const token = localStorage.getItem('access_token') || sessionStorage.getItem('access_token');
            if (!token) {
                const match = document.cookie.match(/sessionid=([^;]+)/);
                if (!match) return '';
            }
            return token || '';
        }

        function handleWSMessage(data) {
            if (data.type === 'connected') {
                loadTickets();
            } else if (data.type === 'new_message') {
                if (data.ticket_id == currentTicketId) {
                    appendMessage(data.message);
                }
            } else if (data.type === 'status_update') {
                if (data.ticket_id == currentTicketId) {
                    document.getElementById('statusFilter').value = data.status;
                }
            } else if (data.type === 'priority_update') {
                if (data.ticket_id == currentTicketId) {
                    document.getElementById('priorityFilter').value = data.priority;
                }
            }
        }

        function appendMessage(msg) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = `message ${msg.is_admin ? 'admin-msg' : 'user-msg'}`;
            const time = new Date(msg.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            const attachmentsHtml = (msg.attachments || []).map(a =>
                `<div class="attachments"><img src="${a.image}" onclick="window.open(this.src)"></div>`
            ).join('');
            div.innerHTML = `
                <span class="sender">${msg.sender_name}</span>
                <div class="bubble">${escapeHtml(msg.message)}</div>
                <span class="time">${time}</span>
                ${attachmentsHtml}
            `;
            container.appendChild(div);
            if (autoScroll) container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function loadTickets() {
            fetch('/support/admin/tickets/')
                .then(r => r.json())
                .then(data => {
                    const list = document.getElementById('ticket-list');
                    list.innerHTML = '';
                    data.tickets.forEach(t => {
                        const div = document.createElement('div');
                        div.className = `ticket-item ${t.id == currentTicketId ? 'active' : ''}`;
                        const time = new Date(t.created_at).toLocaleDateString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
                        div.innerHTML = `
                            <div class="subject">${escapeHtml(t.subject)}</div>
                            <div class="meta">
                                <span><span class="badge badge-${t.status}">${t.status.replace('_',' ')}</span> <span class="badge badge-${t.priority}">${t.priority}</span></span>
                                <span>${time}</span>
                            </div>
                            <div style="font-size:11px;color:#888;margin-top:2px">${t.user_name} • ${t.message_count} msgs</div>
                        `;
                        div.onclick = () => selectTicket(t.id);
                        list.appendChild(div);
                    });
                });
        }

        function selectTicket(id, evt) {
            currentTicketId = id;
            document.getElementById('noSelection').style.display = 'none';
            document.getElementById('chatView').style.display = 'flex';
            loadTicketDetail(id);
            connectWS();
            document.querySelectorAll('.ticket-item').forEach(el => el.classList.remove('active'));
            if (evt && evt.currentTarget) {
                evt.currentTarget.classList.add('active');
            }
        }

        function loadTicketDetail(id) {
            fetch(`/support/admin/tickets/${id}/`)
                .then(r => r.json())
                .then(data => {
                    document.getElementById('ticketSubject').textContent = data.subject;
                    document.getElementById('ticketInfo').textContent = `${data.user_name} (${data.user_email}) • Created ${new Date(data.created_at).toLocaleString()}`;
                    document.getElementById('statusFilter').value = data.status;
                    document.getElementById('priorityFilter').value = data.priority;
                    document.getElementById('messageCount').textContent = `${data.messages.length} messages`;
                    const container = document.getElementById('chatMessages');
                    container.innerHTML = '';
                    data.messages.forEach(m => appendMessage(m));
                    autoScroll = true;
                });
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text || !currentTicketId || !ws || ws.readyState !== WebSocket.OPEN) return;
            ws.send(JSON.stringify({
                type: 'send_message',
                ticket_id: currentTicketId,
                message: text,
                is_admin: true,
            }));
            input.value = '';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function updateTicketStatus() {
            const status = document.getElementById('statusFilter').value;
            if (!currentTicketId) return;
            ws.send(JSON.stringify({ type: 'update_status', ticket_id: currentTicketId, status }));
        }

        function updateTicketPriority() {
            const priority = document.getElementById('priorityFilter').value;
            if (!currentTicketId) return;
            ws.send(JSON.stringify({ type: 'update_priority', ticket_id: currentTicketId, priority }));
        }

        loadTickets();
        setInterval(loadTickets, 30000);
        connectWS();
    </script>
</body>
</html>
