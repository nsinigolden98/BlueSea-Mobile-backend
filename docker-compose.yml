# BlueSea Rust (Axum) backend — complete standalone stack.
# Replaces the Django compose project at cutover: stop that project,
# then `docker compose up -d --build` here.
#
# Bring-up (from this directory, with .env filled in):
#   1. docker compose up -d --build db
#      # fresh database: nothing to do — the app runs sqlx migrations
#      # on boot (./migrations; baseline + incremental files).
#      # (an already-migrated database needs none of this)
#   2. First-time TLS (nginx serves the ACME challenge over HTTP):
#        docker compose up -d nginx
#        docker compose run --rm certbot certonly --webroot -w /var/www/certbot \
#          -d api.blueseamobile.com --email you@example.com --agree-tos --no-eff-email
#   3. docker compose up -d --build
#   4. curl https://api.blueseamobile.com/health
#
# Notes:
# - Single `app` replica: the schedulers (auto-topup beat, marketplace
#   expiry/reminders) run in-process. To scale out, set
#   AUTOTOPUP_SCHEDULER=0 and MARKETPLACE_SCHEDULER=0 on every extra replica.
# - The schema is owned by sqlx migrations (./migrations); the app runs
#   them automatically on boot (`sqlx::migrate!` — no-op when up to date).
# - Backups: pg_dump on a cron (see README).

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: bluesea-backend:rust
    env_file:
      - .env
    environment:
      - PORT=8000
      - MEDIA_ROOT=/app/media
      - DATABASE_URL=postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@db:5432/${DATABASE_NAME}
    volumes:
      - media_volume:/app/media
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - media_volume:/app/media:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    restart: unless-stopped
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  # Renews (not issues) certificates twice daily; issuance is step 2 above.
  certbot:
    image: certbot/certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  media_volume:
